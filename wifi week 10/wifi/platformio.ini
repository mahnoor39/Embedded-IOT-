[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

# WiFi and core libraries
lib_deps = 
    espressif/arduino-esp32@^3.0.0
    bblanchon/ArduinoJson@^6.21.3

# Build configuration
build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -Wl,-Teagle.flash.4m.ld

# Upload settings
upload_port = COM3  ; Update to your actual port
upload_speed = 921600
